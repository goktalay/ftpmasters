# Windows exe'lerini derler.
# - "v1.2.3" gibi bir etiket gönderilince: sürümü etiketten alır, derler ve GitHub Release'e ekler.
# - Actions sekmesinden elle çalıştırılınca (workflow_dispatch): yalnızca derler, exe'leri "artifact" olarak saklar
#   (etiketli sürümde artifact yüklenmez).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Exe'leri derle
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Yalnızca elle çalıştırmada: etiketli sürümde exe'ler zaten Release'e eklenir. Etikette de
      # yüklenseydi hesabın artifact kotası dolduğunda sürüm yayınlanmadan iş başarısız olurdu.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: FTP-Masters-windows
          path: dist/*.exe
          retention-days: 14

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      # Exe kullanıcılara ayrıca ftpmasters.com'daki kişiye özel bağlantıyla (Mastertool hesabı) dağıtılır.
      # Anahtar depo secret'ı FTPM_RELEASE_KEY'dedir; tanımlı değilse adım atlanır.
      # Ayrıntılar scripts/upload-ftpmasters.sh.
      - name: ftpmasters.com'a yükle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          FTPM_RELEASE_KEY: ${{ secrets.FTPM_RELEASE_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          bash scripts/upload-ftpmasters.sh "$V" "dist/FTP-Masters-Setup-$V.exe" "$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")" "dist/FTP-Masters-Portable-$V.exe"
