<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2438"/>
      <stop offset="0.55" stop-color="#0f1626"/>
      <stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Zemin (SSH Master ile ortak) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow2)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- Klasör -->
  <path d="M104 172 a28 28 0 0 1 28 -28 h74 l30 32 h144 a28 28 0 0 1 28 28 v152 a28 28 0 0 1 -28 28 H132 a28 28 0 0 1 -28 -28 z"
        fill="url(#folder)" stroke="url(#accent)" stroke-width="22" stroke-linejoin="round"/>

  <!-- Parlama -->
  <g filter="url(#soft)" opacity="0.6" fill="none" stroke="#22d3ee" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 336 V236 M178 270 l36 -36 36 36"/>
    <path d="M298 236 V336 M262 302 l36 36 36 -36"/>
  </g>

  <!-- Yükle / İndir okları -->
  <g fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 336 V236 M178 270 l36 -36 36 36"/>
    <path d="M298 236 V336 M262 302 l36 36 36 -36"/>
  </g>
</svg>
